name: Auto Release (Dependabot)

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.3.0. Leave empty to bump the patch.'
        required: false
        type: string

jobs:
  tag:
    # Runs for a manual dispatch, or for a merged Dependabot PR from the uv
    # (Python dependency) ecosystem. github-actions bumps never change the
    # published package, so they merge without even starting this job. A uv
    # PR releases only if the "Classify" step below finds it changed what a
    # wheel declares.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/'))
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_ACTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # need all tags + the merge commit
          token: ${{ steps.app-token.outputs.token }}

      # Dependabot's uv PRs usually touch uv.lock alone, and the lock is not in
      # the wheel: its dependency metadata comes from [project] in
      # pyproject.toml. So compare that across the squash merge; a lock-only or
      # dev-group bump would publish an identical package under a new version.
      # A dependency crossing a major version gets a minor release, since it
      # changes what consumers resolve. Stdlib-only, so no project install.
      - name: Classify the Dependabot change
        id: kind
        if: github.event_name == 'pull_request'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git show "${MERGE_SHA}^:pyproject.toml" > "${RUNNER_TEMP}/before.toml"
          git show "${MERGE_SHA}:pyproject.toml" > "${RUNNER_TEMP}/after.toml"
          kind=$(python3 scripts/dependabot_release_kind.py \
            "${RUNNER_TEMP}/before.toml" "${RUNNER_TEMP}/after.toml")
          if [ "$kind" = none ]; then
            echo "::notice::Runtime dependencies unchanged; merged without a release."
          fi
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: ver
        if: steps.kind.outputs.kind != 'none'
        env:
          REQUESTED: ${{ inputs.version }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          if [ -n "$REQUESTED" ]; then
            if ! printf '%s' "$REQUESTED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input '$REQUESTED' must look like v1.2.3"
              exit 1
            fi
            next="$REQUESTED"
            echo "Releasing requested version: $next"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [ "$KIND" = minor ]; then
              next="v${major}.$((minor + 1)).0"
              echo "Releasing next minor: $next (from ${latest})"
            else
              next="v${major}.${minor}.$((patch + 1))"
              echo "Releasing next patch: $next (from ${latest})"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::tag $next already exists"
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      # Files the release section under the version being cut, so no published
      # version can end up without one. Stdlib-only, so no project install.
      - name: Prepare CHANGELOG
        if: steps.kind.outputs.kind != 'none'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: python3 scripts/changelog_release.py --version "$NEXT"

      - name: Commit, tag and push
        if: steps.kind.outputs.kind != 'none'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          REASON: ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || format('Dependabot PR {0}', github.event.pull_request.number) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The script is a no-op when the section already exists (a human may
          # have written it in the release PR), and committing nothing would
          # fail and abort an otherwise valid release.
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already had a $NEXT section; nothing to commit."
          else
            git add CHANGELOG.md
            git commit -m "docs: changelog for $NEXT ($REASON)"
            git push origin HEAD:main
          fi

          # Tag AFTER the commit so the tagged tree contains its own changelog
          # section; tagging first would ship every release without one.
          git tag -a "$NEXT" -m "Automated release $NEXT ($REASON)"
          git push origin "$NEXT"
