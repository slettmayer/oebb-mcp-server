name: Auto Release (Dependabot)

on:
  pull_request:
    types: [closed]

jobs:
  tag:
    # Only merged Dependabot PRs from the uv (Python dependency) ecosystem —
    # those change the published package. github-actions bumps do not, so they
    # merge without cutting a release.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_ACTION_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # need all tags + the merge commit
          token: ${{ steps.app-token.outputs.token }}
      - name: Compute next patch version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (from ${latest})"
      - name: Create and push tag
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Automated release $NEXT (Dependabot #$PR)"
          git push origin "$NEXT"
