version: 2
# The two ecosystems run on different days. Their PRs auto-merge, and the
# ruleset requires a branch to be up to date with main -- which auto-merge
# never does for you -- so a same-day pair would strand the second PR.
updates:
  # Python dependencies (managed via uv / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      github-actions:
        patterns:
          - "*"
