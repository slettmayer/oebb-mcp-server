[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oebb-mcp-server"
version = "0.1.0"
description = "MCP server for OeBB (Austrian Federal Railways) train data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "aiohttp>=3.0.0",
]

[project.scripts]
oebb-mcp-server = "oebb_mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real external APIs (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
